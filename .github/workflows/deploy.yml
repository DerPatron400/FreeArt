# Every push to main goes live on https://freeart.pages.dev; a push to any other
# branch gets its own preview address (shown in the run's log).
# Needs two repository secrets: CLOUDFLARE_API_TOKEN (a token with "Cloudflare Pages: Edit")
# and CLOUDFLARE_ACCOUNT_ID.
name: Deploy

on:
  push:
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The site is the repo minus the server's own files; functions/ stays beside it.
      - name: Gather the site
        run: |
          mkdir _site
          rsync -a ./ _site/ --exclude .git --exclude .github --exclude _site \
            --exclude functions --exclude 'wrangler*' --exclude schema/server.sql
          sed -i 's|^pages_build_output_dir = .*|pages_build_output_dir = "_site"|' wrangler.toml

      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4'
          command: pages deploy --project-name freeart --branch ${{ github.ref_name }} --commit-hash ${{ github.sha }} --commit-message "${{ github.ref_name }} ${{ github.sha }}"
